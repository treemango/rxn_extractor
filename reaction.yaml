# ============================================================================
# DOMAIN DEFINITION: Ethylene Conversion
# ============================================================================
domain_name: "ethylene_conversion"
domain_description: "Extraction of catalyst identity, preparation, characterization, and ethylene reaction conditions."
target_reaction: "oligomerization of ethylene to produce C6-C12 olefins, or any reaction involving ethylene conversion to higher hydrocarbons."
input_markdown_dir: "markdowns2/"

# ============================================================================
# PARSER AGENT CONFIGURATION
# ============================================================================
parser:
  role_description: >
    You are an expert chemical engineering researcher specializing in ethylene conversion and catalytic reactions.
  task_description: >
    Extract and enumerate distinct experiments from a research paper.
    Each unique catalyst formulation or set of reaction conditions = 1 experiment.
  experiment_differentiators:
    - "Different catalyst classes, active metals, supports, or metal loadings"
    - "Different preparation, pretreatment, or activation methods"
    - "Different reaction conditions (temperature, total or ethylene partial pressure, WHSV, GHSV)"
  few_shot_examples:
    - input: >
        "We tested Ni/Al2O3 and Pt/Al2O3 at 200°C."
      output: >
        2 experiments: Exp 1 (Ni/Al2O3 @ 200°C), Exp 2 (Pt/Al2O3 @ 200°C)

# ============================================================================
# SUB-DOMAIN DEFINITIONS
# ============================================================================
sub_domains:

  # --------------------------------------------------------------------------
  # 1: Catalyst Properties
  # --------------------------------------------------------------------------
  - name: "catalyst"
    display_name: "Catalyst Properties"
    role_description: >
      You are an expert in heterogeneous catalysis and material characterization.
    task_description: >
      Extract catalyst identity, preparation, activation, and physicochemical/acid-site characterization for the specific experiment.
    extraction_rules:
      - "Keep the reported units for numeric characterization values; do not convert unlike measurement bases."
      - "Distinguish total acidity measured by NH3-TPD from Brønsted/Lewis acid-site densities measured by pyridine-IR."
      - "If a value is not stated, return null — NEVER invent data."
      - "Always provide an exact quote from the paper."
    fields:
      - name: "catalyst_class"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Class of catalyst (e.g., heterogeneous, M-M oxide, MOF)"
        ui_render: "text_input"
        
      - name: "active_metal"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "The main active metal (e.g., Ni, Pt, Pd)"
        ui_render: "text_input"
        
      - name: "metal_loading"
        type: "float"
        target_unit: null
        allowed_units: ["wt%", "mass%", "at%", "mol%"]
        min: null
        max: null
        prompt_hint: "Numeric loading of the active metal; report the stated basis as its unit (e.g., 5 wt%)."
        ui_render: "number_input"
        
      - name: "support_identity"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Chemical identity and composition of the support (e.g., Al2O3, SiO2, carbon)."
        ui_render: "text_input"
        
      - name: "preparation_method"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Catalyst preparation or synthesis method (e.g., impregnation, co-precipitation)."
        ui_render: "text_area"

      - name: "pretreatment_or_activation"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Pretreatment or activation conditions/method, including gas, temperature, and duration when stated."
        ui_render: "text_area"

      - name: "surface_area"
        type: "float"
        target_unit: null
        allowed_units: ["m2/g", "m²/g"]
        min: 0
        max: 3000
        prompt_hint: "BET specific surface area; preserve the reported unit."
        ui_render: "number_input"

      - name: "pore_diameter"
        type: "float"
        target_unit: null
        allowed_units: ["nm", "A", "Å", "angstrom", "um", "µm"]
        min: null
        max: null
        prompt_hint: "Mean or characteristic pore diameter; preserve the reported unit."
        ui_render: "number_input"

      - name: "pore_volume"
        type: "float"
        target_unit: null
        allowed_units: ["cm3/g", "cm³/g", "mL/g", "mm3/g", "mm³/g"]
        min: null
        max: null
        prompt_hint: "Specific pore volume; preserve the reported unit."
        ui_render: "number_input"

      - name: "total_acidity"
        type: "float"
        target_unit: null
        allowed_units: ["mmol/g", "umol/g", "µmol/g", "mmol/kg"]
        min: null
        max: null
        prompt_hint: "Total acidity measured by NH3-TPD; do not substitute a different acidity method."
        ui_render: "number_input"

      - name: "bronsted_acid_site_density"
        type: "float"
        target_unit: null
        allowed_units: ["mmol/g", "umol/g", "µmol/g", "umol/m2", "µmol/m²"]
        min: null
        max: null
        prompt_hint: "Brønsted acid-site density measured by pyridine-IR; preserve the stated unit and basis."
        ui_render: "number_input"

      - name: "lewis_acid_site_density"
        type: "float"
        target_unit: null
        allowed_units: ["mmol/g", "umol/g", "µmol/g", "umol/m2", "µmol/m²"]
        min: null
        max: null
        prompt_hint: "Lewis acid-site density; preserve the stated unit and measurement basis."
        ui_render: "number_input"

  # --------------------------------------------------------------------------
  # 2: Reaction Conditions
  # --------------------------------------------------------------------------
  - name: "conditions"
    display_name: "Reaction Conditions"
    role_description: >
      You are an expert in reactor engineering and operating conditions.
    task_description: >
      Extract the exact operating parameters for the experiment.
    extraction_rules:
      - "Capture ranges if tested over a range."
      - "Always provide an exact quote from the paper."
    fields:
      - name: "reactor_type"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Type of reactor (e.g., fixed-bed, batch, continuous)"
        ui_render: "text_input"
        
      - name: "temperature"
        type: "range"
        target_unit: "Celsius"
        allowed_units: ["Celsius", "Kelvin"]
        min: -50
        max: 1500
        prompt_hint: "Reaction temperature"
        ui_render: "range_input"
        
      - name: "total_pressure"
        type: "float"
        target_unit: "atm"
        allowed_units: ["atm", "bar", "MPa", "psi", "kPa"]
        min: 0.01
        max: 1000
        prompt_hint: "Total reactor pressure, not ethylene partial pressure."
        ui_render: "number_input"

      - name: "ethylene_partial_pressure"
        type: "float"
        target_unit: "atm"
        allowed_units: ["atm", "bar", "MPa", "psi", "kPa"]
        min: 0.01
        max: 1000
        prompt_hint: "Ethylene partial pressure; do not copy total pressure unless explicitly identified as ethylene partial pressure."
        ui_render: "number_input"
        
      - name: "whsv"
        type: "float"
        target_unit: null
        allowed_units: ["h-1", "h⁻¹", "g_feed/g_cat/h", "g_feed g_cat-1 h-1", "WHSV"]
        min: 0.01
        max: 1000000
        prompt_hint: "Weight hourly space velocity (WHSV), not GHSV; preserve the reported unit and basis."
        ui_render: "number_input"

      - name: "ghsv"
        type: "float"
        target_unit: null
        allowed_units: ["h-1", "h⁻¹", "mL/g/h", "L/kg/h", "mL/mL/h", "cm3/cm3/h", "GHSV"]
        min: 0.01
        max: 1000000
        prompt_hint: "Gas hourly space velocity (GHSV), not WHSV; preserve the reported unit and basis."
        ui_render: "number_input"

      - name: "time_on_stream"
        type: "range"
        target_unit: "hours"
        allowed_units: ["hours", "days", "minutes", "seconds"]
        min: 0.01
        max: 10000
        prompt_hint: "Time-on-stream for this reaction experiment; capture a range where reported."
        ui_render: "range_input"

# ============================================================================
# CONFIGURATION
# ============================================================================
confidence_scale:
  5: "Explicitly stated with exact values and units"
  4: "Clearly inferable from context or figures"
  3: "Requires some interpretation or minor ambiguity"
  2: "High ambiguity or missing key information"
  1: "Could not be confidently extracted"

validation_rules: []

confidence_algorithm:
  method: "weakest_link"
  review_threshold: 3
