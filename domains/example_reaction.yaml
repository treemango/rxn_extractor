# ============================================================================
# DOMAIN DEFINITION: Ethylene Conversion
# ============================================================================
domain_name: "ethylene_conversion"
domain_description: "Extraction of catalytic data for ethylene conversion reactions, including catalyst properties and performance metrics."
input_markdown_dir: "markdowns/"

# ============================================================================
# PARSER AGENT CONFIGURATION
# ============================================================================
parser:
  role_description: >
    You are an expert chemical engineering researcher specializing in ethylene conversion and catalytic reactions.
  task_description: >
    Extract and enumerate distinct experiments from a research paper.
    Each unique catalytic configuration or set of reaction conditions = 1 experiment.
  experiment_differentiators:
    - "Different catalyst formulations, active metals, or supports"
    - "Different reaction conditions (temperature, pressure, space velocity)"
  few_shot_examples:
    - input: >
        "We tested Ni/Al2O3 and Pt/Al2O3 at 200°C."
      output: >
        2 experiments: Exp 1 (Ni/Al2O3 @ 200°C), Exp 2 (Pt/Al2O3 @ 200°C)

# ============================================================================
# SUB-DOMAIN DEFINITIONS
# ============================================================================
sub_domains:

  # --------------------------------------------------------------------------
  # 1: Catalyst Properties
  # --------------------------------------------------------------------------
  - name: "catalyst"
    display_name: "Catalyst Properties"
    role_description: >
      You are an expert in heterogeneous catalysis and material characterization.
    task_description: >
      Extract catalyst design and characterization properties for the specific experiment.
    extraction_rules:
      - "Extract precise names and structural properties."
      - "If a value is not stated, return null — NEVER invent data."
      - "Always provide an exact quote from the paper."
    fields:
      - name: "catalyst_name"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Exact formulation (e.g., Ni/Al2O3, zeolite-Y)"
        ui_render: "text_input"
        
      - name: "catalyst_class"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Class of catalyst (e.g., heterogeneous, M-M oxide, MOF)"
        ui_render: "text_input"
        
      - name: "exposed_facet"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Specific exposed crystal facet (e.g., (111), (100))"
        ui_render: "text_input"
        
      - name: "active_metal"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "The main active metal (e.g., Ni, Pt, Pd)"
        ui_render: "text_input"
        
      - name: "metal_loading"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Metal loading fraction or wt% (e.g., '5 wt%', 'Ni/Al fraction')"
        ui_render: "text_input"
        
      - name: "support"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "The catalyst support material (e.g., Al2O3, SiO2, Carbon)"
        ui_render: "text_input"
        
      - name: "support_topology"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Topology or structure of the support (e.g., mesoporous, hierarchical)"
        ui_render: "text_input"
        
      - name: "surface_area"
        type: "float"
        target_unit: "m2/g"
        allowed_units: ["m2/g", "m²/g"]
        min: 0.1
        max: 3000
        prompt_hint: "BET surface area"
        ui_render: "number_input"
        
      - name: "catalyst_deactivation"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Notes on deactivation mechanism (e.g., coking, sintering) if mentioned"
        ui_render: "text_area"

  # --------------------------------------------------------------------------
  # 2: Reaction Conditions
  # --------------------------------------------------------------------------
  - name: "conditions"
    display_name: "Reaction Conditions"
    role_description: >
      You are an expert in reactor engineering and operating conditions.
    task_description: >
      Extract the exact operating parameters for the experiment.
    extraction_rules:
      - "Capture ranges if tested over a range."
      - "Always provide an exact quote from the paper."
    fields:
      - name: "reactor_type"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Type of reactor (e.g., fixed-bed, batch, continuous)"
        ui_render: "text_input"
        
      - name: "temperature"
        type: "range"
        target_unit: "Celsius"
        allowed_units: ["Celsius", "Kelvin"]
        min: -50
        max: 1500
        prompt_hint: "Reaction temperature"
        ui_render: "range_input"
        
      - name: "pressure"
        type: "float"
        target_unit: "atm"
        allowed_units: ["atm", "bar", "MPa", "psi", "kPa"]
        min: 0.01
        max: 1000
        prompt_hint: "Operating pressure"
        ui_render: "number_input"
        
      - name: "space_velocity"
        type: "float"
        target_unit: "h-1"
        allowed_units: ["h-1", "mL/g/h", "L/kg/h", "WHSV", "GHSV"]
        min: 0.01
        max: 1000000
        prompt_hint: "Space velocity (WHSV, GHSV, etc.)"
        ui_render: "number_input"
        
      - name: "feed_composition"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Composition of the feed gas/liquid (e.g., '10% C2H4 in Ar')"
        ui_render: "text_input"
        
      - name: "testing_time"
        type: "range"
        target_unit: "hours"
        allowed_units: ["hours", "days", "minutes"]
        min: 0.01
        max: 10000
        prompt_hint: "Time on stream or duration the catalyst was tested"
        ui_render: "range_input"

  # --------------------------------------------------------------------------
  # 3: Catalytic Performance
  # --------------------------------------------------------------------------
  - name: "performance"
    display_name: "Catalytic Performance"
    role_description: >
      You are an expert in catalytic performance evaluation and kinetics.
    task_description: >
      Extract conversion, selectivity, and kinetic parameters.
    extraction_rules:
      - "Ensure percentage values are between 0 and 100."
      - "Always provide an exact quote from the paper."
    fields:
      - name: "ethylene_conversion"
        type: "float"
        target_unit: "%"
        allowed_units: ["%"]
        min: 0
        max: 100
        prompt_hint: "Ethylene conversion percentage"
        ui_render: "number_input"
        
      - name: "c8_c16_selectivity"
        type: "float"
        target_unit: "%"
        allowed_units: ["%"]
        min: 0
        max: 100
        prompt_hint: "Selectivity towards C8-C16 products"
        ui_render: "number_input"
        
      - name: "isomers_selectivity"
        type: "float"
        target_unit: "%"
        allowed_units: ["%"]
        min: 0
        max: 100
        prompt_hint: "Selectivity towards specific isomers (mention which ones in quote)"
        ui_render: "number_input"
        
      - name: "yield"
        type: "float"
        target_unit: "%"
        allowed_units: ["%"]
        min: 0
        max: 100
        prompt_hint: "Overall product yield percentage"
        ui_render: "number_input"
        
      - name: "reaction_rate"
        type: "float"
        target_unit: "mol/g/h"
        allowed_units: ["mol/g/h", "mmol/g/h", "g/g/h"]
        min: 0
        max: null
        prompt_hint: "Specific reaction rate"
        ui_render: "number_input"
        
      - name: "turnover_frequency"
        type: "float"
        target_unit: "s-1"
        allowed_units: ["s-1", "h-1"]
        min: 0
        max: null
        prompt_hint: "Turnover frequency (TOF)"
        ui_render: "number_input"
        
      - name: "specific_mechanism"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Proposed reaction mechanism (e.g., Cossee-Arlman, metallacycle)"
        ui_render: "text_area"

  # --------------------------------------------------------------------------
  # 4: Paper Metadata
  # --------------------------------------------------------------------------
  - name: "metadata"
    display_name: "Paper Metadata"
    role_description: >
      You are an expert in academic literature and bibliography.
    task_description: >
      Extract publication metadata for this paper.
    extraction_rules:
      - "Extract DOI, journal, and year accurately."
      - "Always provide an exact quote showing where this info was found."
    fields:
      - name: "doi"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Digital Object Identifier (DOI)"
        ui_render: "text_input"
        
      - name: "year_of_publication"
        type: "float"
        target_unit: null
        allowed_units: []
        min: 1900
        max: 2100
        prompt_hint: "Publication year (e.g., 2023)"
        ui_render: "number_input"
        
      - name: "journal"
        type: "string"
        target_unit: null
        allowed_units: []
        min: null
        max: null
        prompt_hint: "Name of the academic journal"
        ui_render: "text_input"

# ============================================================================
# CONFIGURATION
# ============================================================================
confidence_scale:
  5: "Explicitly stated with exact values and units"
  4: "Clearly inferable from context or figures"
  3: "Requires some interpretation or minor ambiguity"
  2: "High ambiguity or missing key information"
  1: "Could not be confidently extracted"

validation_rules: []

confidence_algorithm:
  method: "weakest_link"
  review_threshold: 3
